<div class="modal-overlay" id="puissance4Modal" role="dialog" aria-modal="true" aria-labelledby="p4ModalTitle">
    <div class="modal">
      <div class="modal__header">
        <h2 class="modal__title" id="p4ModalTitle">Puissance 4</h2>
        <button class="modal__close js-close-p4-modal" aria-label="Fermer la modale">×</button>
      </div>
      <div class="modal__body">
        <div class="puissance4">



          <!-- Game Info -->
          <div class="puissance4__info">
            <div class="puissance4__turn" id="p4Turn">
              <span class="puissance4__player-indicator puissance4__player-indicator--red">🔴</span>
              <span id="p4TurnText">Votre tour</span>
            </div>
            <!-- Bet Area -->
            <div class="puissance4__bet-area">
              <label class="puissance4__bet-label" for="p4BetAmount">Mise :</label>
              <input type="number" id="p4BetAmount" class="puissance4__bet-input" value="100" min="50" max="500"
                step="50" aria-label="Montant de la mise en points" />
              <span class="puissance4__bet-label">pts</span>
            </div>

            <div class="puissance4__score-display" id="p4ScoreDisplay">
              Vous: 🔴 | Robot: 🟡
            </div>
          </div>

          <!-- Game Board -->
          <div class="puissance4__board-container">
            <div class="puissance4__board" id="p4Board">
              <!-- 7 columns × 6 rows = 42 cells (generated by JS) -->
            </div>
          </div>

          <!-- Game Result -->
          <div class="puissance4__result" id="p4Result" style="display: none;"></div>

          <!-- Game Controls -->
          <div class="puissance4__controls">
            <button class="puissance4__btn puissance4__btn--primary" id="p4StartBtn">Commencer la partie</button>
            <button class="puissance4__btn puissance4__btn--ghost" id="p4ResetBtn" disabled>Nouvelle partie</button>
          </div>
        </div>
      </div>
    </div>
  </div>
