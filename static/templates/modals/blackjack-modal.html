<div class="modal-overlay" id="blackjackModal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <div class="modal">
      <div class="modal__header">
        <h2 class="modal__title" id="modalTitle">Table Blackjack</h2>
        <button class="modal__close js-close-modal" aria-label="Fermer la modale">×</button>
      </div>
      <div class="modal__body">
        <div class="blackjack">
          <!-- Bet Area -->
          <div class="blackjack__bet-area">
            <label class="blackjack__bet-label" for="betAmount">Mise :</label>
            <input type="number" id="betAmount" class="blackjack__bet-input" value="100" min="0" max="5000" step="50"
              aria-label="Montant de la mise en points" />
            <span class="blackjack__bet-label">pts</span>
          </div>

          <!-- Game Table -->
          <div class="blackjack__table">
            <!-- Dealer -->
            <div class="blackjack__dealer">
              <div class="blackjack__label">🎩 Croupier</div>
              <div class="blackjack__cards" id="dealerCards">
                <!-- Cards populated by JS -->
              </div>
              <div class="blackjack__score" id="dealerScore">Score: —</div>
            </div>

            <!-- Player -->
            <div class="blackjack__player">
              <div class="blackjack__label">👤 Vous</div>
              <div class="blackjack__cards" id="playerCards">
                <!-- Cards populated by JS -->
              </div>
              <div class="blackjack__score" id="playerScore">Score: —</div>
            </div>
          </div>

          <!-- Game Controls -->
          <div class="blackjack__controls" id="gameControls">
            <button class="blackjack__btn blackjack__btn--primary" id="dealBtn">Distribuer</button>
            <button class="blackjack__btn blackjack__btn--secondary" id="hitBtn" disabled>Tirer</button>
            <button class="blackjack__btn blackjack__btn--secondary" id="standBtn" disabled>Rester</button>
            <button class="blackjack__btn blackjack__btn--ghost" id="resetBtn" disabled>Nouvelle partie</button>
          </div>

          <!-- Result -->
          <div class="blackjack__result" id="gameResult"></div>
        </div>
      </div>
    </div>
  </div>
