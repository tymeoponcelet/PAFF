<!-- POPUP GAIN BLACKJACK -->
<div class="win-popup-overlay" id="winPopupOverlay">
  <div class="win-popup">
    <div class="win-popup__icon" id="winPopupIcon">🎉</div>
    <h2 class="win-popup__title" id="winPopupTitle">Victoire !</h2>
    <div class="win-popup__amount" id="winPopupAmount">+500 pts</div>
    
    <div class="win-popup__details">
      <div class="win-popup__detail-row">
        <span class="win-popup__detail-label">Mise initiale :</span>
        <span class="win-popup__detail-value" id="winPopupBet">100 pts</span>
      </div>
      <div class="win-popup__detail-row">
        <span class="win-popup__detail-label">Votre score :</span>
        <span class="win-popup__detail-value" id="winPopupPlayerScore">21</span>
      </div>
      <div class="win-popup__detail-row">
        <span class="win-popup__detail-label">Score croupier :</span>
        <span class="win-popup__detail-value" id="winPopupDealerScore">19</span>
      </div>
      <div class="win-popup__detail-row" style="margin-top: 1rem; padding-top: 1rem; border-top: 1px solid rgba(255, 255, 255, 0.1);">
        <span class="win-popup__detail-label">Nouveau solde :</span>
        <span class="win-popup__detail-value" id="winPopupNewBalance">5500 pts</span>
      </div>
    </div>

    <p class="win-popup__message" id="winPopupMessage">Vous avez battu le croupier !</p>
    
    <button class="win-popup__button" id="winPopupButton">Continuer</button>
  </div>
</div>
