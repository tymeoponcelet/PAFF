<section class="section" id="leaderboard">
  <div class="container">
    <div class="leaderboard">
      <div class="leaderboard__header">
        <h2 class="section__title">🏆 Classement</h2>
        <div class="leaderboard__tabs">
          <button class="leaderboard__tab leaderboard__tab--active" data-tab="individuel">
            Individuel
          </button>
          <button class="leaderboard__tab" data-tab="classe">
            Par Classe
          </button>
          <button class="leaderboard__tab" data-tab="jeu">
            Par Jeu
          </button>
        </div>
        <button class="leaderboard__refresh" id="leaderboardRefresh" aria-label="Actualiser le classement">
          <svg class="leaderboard__refresh-icon" width="24" height="24" viewBox="0 0 24 24">
            <path d="M17.65 6.35C16.2 4.9 14.21 4 12 4c-4.42 0-7.99 3.58-7.99 8s3.57 8 7.99 8c3.73 0 6.84-2.55 7.73-6h-2.08c-.82 2.33-3.04 4-5.65 4-3.31 0-6-2.69-6-6s2.69-6 6-6c1.66
                     0 3.14.69 4.22 1.78L13 11h7V4l-2.35 2.35z" fill="currentColor"/>
          </svg>
        </button>
      </div>
      <!-- Classement Individuel -->
      <div class="leaderboard__content leaderboard__content--active" id="leaderboard-individuel">
        <table class="leaderboard__table">
          <thead>
            <tr>
              <th>Rang</th>
              <th>Pseudo</th>
              <th>Classe</th>
              <th>Points</th>
            </tr>
          </thead>
          <tbody id="leaderboard-individuel-body">
            <tr>
              <td colspan="4" class="leaderboard__loading">
                <div class="spinner"></div>
                Chargement...
              </td>
            </tr>
          </tbody>
        </table>
      </div>

      <!-- Classement par Classe -->
      <div class="leaderboard__content" id="leaderboard-classe">
        <table class="leaderboard__table">
          <thead>
            <tr>
              <th>Rang</th>
              <th>Classe</th>
              <th>Membres</th>
              <th>Points Totaux</th>
              <th>Moyenne</th>
            </tr>
          </thead>
          <tbody id="leaderboard-classe-body">
            <tr>
              <td colspan="5" class="leaderboard__loading">
                <div class="spinner"></div>
                Chargement...
              </td>
            </tr>
          </tbody>
        </table>
      </div>

      <!-- Classement par Jeu (meilleur score de chaque joueur) -->
      <div class="leaderboard__content" id="leaderboard-jeu">
        <div class="leaderboard__jeu-choix">
          <label for="leaderboardJeu">Jeu :</label>
          <select class="duel__champ" id="leaderboardJeu" style="flex: 0 1 14rem;">
            <option value="quiz">Quiz</option>
            <option value="flappy">Flappy Bird</option>
            <option value="tapetaupe">Tape-Taupe</option>
          </select>
        </div>
        <table class="leaderboard__table">
          <thead>
            <tr>
              <th>Rang</th>
              <th>Pseudo</th>
              <th>Classe</th>
              <th>Meilleur score</th>
            </tr>
          </thead>
          <tbody id="leaderboard-jeu-body">
            <tr>
              <td colspan="4" class="leaderboard__loading">Chargement...</td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>
</section>
